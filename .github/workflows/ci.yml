name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/app ./cmd

      - name: Run unit tests
        env:
          JWT_SECRET: test_secret_for_ci_only_minimum_32_chars
          APP_ENV: test
        run: go test ./middleware/... -v

      - name: Check test coverage
        env:
          JWT_SECRET: test_secret_for_ci_only_minimum_32_chars
          APP_ENV: test
        run: go test ./middleware/... -coverprofile=coverage.out && go tool cover -func=coverage.out
