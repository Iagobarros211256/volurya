services:
  postgres_payment_test:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: volurya_payment_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d volurya_payment_test"]
      interval: 5s
      timeout: 3s
      retries: 10
