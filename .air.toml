# .air.toml
# Diretório do projeto
root = "."
tmp_dir = "tmp"

[build]
# Comando para buildar ou rodar o projeto
cmd = "go run main.go"
# Ignorar arquivos desnecessários
exclude_dir = ["assets", "tmp", "vendor"]
# Extensões de arquivos que disparam reload
include_ext = ["go", "tpl", "tmpl", "html"]

[color]
# Cores no terminal
main = "cyan"
watcher = "yellow"
build = "green"
runner = "magenta"
