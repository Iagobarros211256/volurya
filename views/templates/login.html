<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - VOLURYA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-light">

 

  <!-- Hero -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo" style="max-width: 300px;">
  </section>

  <!-- Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <h2 class="text-danger mb-4 text-center" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 10px #ff0000;">
          ENTRAR NA ÁREA VIP
        </h2>

        <form id="loginForm">
          <div class="mb-3">
            <input type="email" id="email" class="form-control bg-dark text-white border-danger" placeholder="Email" required autofocus>
          </div>
          <div class="mb-3 password-field">
            <input type="password" id="password" class="form-control bg-dark text-white border-danger password-input" placeholder="Senha" required minlength="8">
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Mostrar senha">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">LOGIN</button>
        </form>

        <p class="mt-4 text-center text-light">
          Ainda não tem conta? <a href="/signup" class="text-danger fw-bold">CADASTRE-SE</a>
        </p>

      </div>
    </div>
  </div>

 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.querySelectorAll('[data-password-toggle]').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const icon = button.querySelector('.fa');
        const isHidden = input.type === 'password';

        input.type = isHidden ? 'text' : 'password';
        button.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
        icon.classList.toggle('fa-eye', !isHidden);
        icon.classList.toggle('fa-eye-slash', isHidden);
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showToast('Preencha email e senha', 'danger');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('refresh_token', data.refresh_token);
          showToast('Login realizado! Redirecionando...', 'success');
          setTimeout(() => window.location.href = getAuthRedirect('/store'), 1500);
        } else {
          showToast(data.error || 'Email ou senha inválidos', 'danger');
        }
      } catch (err) {
        showToast('Erro de conexão. Tente novamente.', 'danger');
      }
    });
  </script>
</body>
</html>


<!--


Token salvo em localStorage
javascriptlocalStorage.setItem('token', data.access_token)
localStorage.setItem('refresh_token', data.refresh_token)
Confirmação do problema já apontado em auth.js e auth_controller.go — vulnerável a XSS.

🔴 password.value.trim() remove espaços da senha
javascriptconst password = document.getElementById('password').value.trim()
Mesmo problema do store-admin.js — senhas com espaços no início/fim são válidas e trim() as modifica silenciosamente, causando falha de login misteriosa. Remova o .trim() da senha.

🔴 Login duplicado com auth.js
auth.js já tem uma função login(email, password) — este template reimplementa o mesmo fluxo inline. Se o comportamento mudar em auth.js, este template não é atualizado automaticamente:
javascript// Substituir todo o submit handler por:
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value  // sem trim
    try {
        await login(email, password)  // função de auth.js
        setTimeout(() => window.location.href = getAuthRedirect('/store'), 1500)
    } catch (err) {
        showToast(err.message || 'Email ou senha inválidos', 'danger')
    }
})

🟡 Sem redirecionamento se já estiver logado
javascript// Falta no início:
if (isLoggedIn()) {
    window.location.href = getAuthRedirect('/store')
}
Usuário logado que acessa /login vê o formulário normalmente.

<!--Linhas em branco com espaço antes do Hero e após o body — provavelmente resquício de conteúdo removido.

🟡 Sem navbar
Todos os outros templates têm navbar. O usuário que chega em /login não tem como navegar para outras páginas sem o botão voltar do browser.

🟢 showToast chamado mas não definido neste escopo sem auth.js
showToast é definido em auth.js que é carregado antes deste script — funciona, mas a dependência é implícita. Se a ordem dos scripts mudar, quebra silenciosamente.
