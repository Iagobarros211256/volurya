<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOLURYA - Official Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-center">

  <!-- HERO -->
  <section class="hero d-flex justify-content-center align-items-center">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo">
  </section>

  <!-- Login Form -->
  <div class="container py-4">
  <h2>Login</h2>
  <div class="mb-3">
    <input type="email" id="email" class="form-control" placeholder="Email">
  </div>
  <div class="mb-3">
    <input type="password" id="password" class="form-control" placeholder="Password">
  </div>
  <button class="btn btn-primary" id="loginBtn">Login</button>

  <div id="loginToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script type="module" src="/static/js/login.js"></script>

</html>
