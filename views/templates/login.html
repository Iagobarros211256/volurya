<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOLURYA - Official Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-center">

  <!-- HERO -->
  <section class="hero d-flex justify-content-center align-items-center">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo">
  </section>

  <!-- Login Form -->
  <div class="container mt-4 text-light">
    <h2>Login</h2>
    <form id="loginForm" class="d-flex flex-column align-items-center">
      <input type="email" id="email" placeholder="Email" class="form-control w-50 mb-2" required>
      <input type="password" id="password" placeholder="Senha" class="form-control w-50 mb-2" required>
      <button type="submit" class="btn btn-danger w-25">Login</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
