<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - VOLURYA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExample01">
        <ul class="navbar-nav me-auto mb-2">
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/">HOME</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/about">ABOUT</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/#musicsection">MUSIC</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/#socialsection">SOCIAL</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/store">STORE</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link active" href="/cart">CARRINHO</a></li>
          <li class="nav-item"><a class="btn btn-outline-primary btn-sm my-2 nav-link" href="/login">Entrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="bg-dark py-4 text-center">
    <h1 class="text-danger" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 15px #ff0000;">
      MEU CARRINHO
    </h1>
  </section>

  <!-- Conteúdo -->
  <div class="container py-4">

    <!-- Loading -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <!-- Carrinho vazio -->
    <div id="empty-cart" class="text-center my-5 d-none">
      <i class="fa fa-shopping-cart fa-4x text-danger mb-3"></i>
      <h4 class="text-light">Seu carrinho está vazio</h4>
      <p class="text-muted">Adicione produtos da nossa loja!</p>
      <a href="/store" class="btn btn-danger mt-2">VER PRODUTOS</a>
    </div>

    <!-- Itens do carrinho -->
    <div id="cart-items"></div>

    <!-- Resumo -->
    <div id="cart-summary" class="d-none">
      <hr style="border-color: #333;">
      <div class="row justify-content-end">
        <div class="col-md-4">
          <div class="p-3 bg-secondary rounded">
            <div class="d-flex justify-content-between mb-3">
              <span class="text-light fw-bold fs-5">Total:</span>
              <span class="text-danger fw-bold fs-5" id="cart-total">R$ 0,00</span>
            </div>
            <button id="checkout-btn" class="btn btn-danger w-100 py-2 fw-bold" onclick="checkout()">
              FINALIZAR COMPRA
            </button>
            <a href="/store" class="btn btn-outline-danger w-100 mt-2">
              CONTINUAR COMPRANDO
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark py-5 text-center mt-5" id="socialsection">
    <div class="container">
      <div class="mb-4">
        <img src="/static/imagens/VOLURYALOGOVAZADA.png" alt="Volurya" style="max-width: 120px; opacity: 0.9;">
      </div>
      <div class="mb-4">
        <a href="#" class="fa fa-facebook mx-2" style="font-size: 24px; color: #aaa; text-decoration: none;"></a>
        <a href="#" class="fa fa-instagram mx-2" style="font-size: 24px; color: #aaa; text-decoration: none;"></a>
        <a href="#" class="fa fa-youtube mx-2" style="font-size: 24px; color: #aaa; text-decoration: none;"></a>
        <a href="#" class="fa fa-spotify mx-2" style="font-size: 24px; color: #aaa; text-decoration: none;"></a>
      </div>
      <hr style="border-color: #333; max-width: 400px; margin: 0 auto 1rem;">
      <p class="text-danger mb-0 small">
        VOLURYA © 2026 — Fortaleza, Brasil
        <br>
        <span style="font-size: 11px; color: #ff4444;">Made with ❤️ and lots of distortion</span>
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/cart.js"></script>
</body>
</html>
