<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOLURYA SHOP - Produtos Oficiais</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-center text-light">

  <!-- Navbar (igual ao index, com Store ativo) -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarsExample01">
        <ul class="navbar-nav me-auto mb-2">
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/">HOME</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/about">ABOUT</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="#musicsection">MUSIC</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="#socialsection">SOCIAL</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link active" href="/store">STORE</a></li>
          <li class="nav-item"><a class="btn btn-outline-primary btn-sm my-2 nav-link" href="/login">Entrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero / Título da loja -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <div class="text-center">
      <h1 class="display-3 text-danger mb-0" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 15px #ff0000;">
        VOLURYA SHOP
      </h1>
      <p class="lead text-light mt-2">Merch oficial da banda mais pesada do Nordeste</p>
    </div>
  </section>

  <!-- Produtos -->
  <div class="container py-5">
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-danger" role="status" style="width: 4rem; height: 4rem;">
        <span class="visually-hidden">Carregando produtos...</span>
      </div>
      <p class="mt-3 text-muted fs-4">Carregando produtos oficiais...</p>
    </div>

    <div id="store-items" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>

    <div id="no-products" class="text-center my-5 d-none">
      <p class="fs-4 text-muted">Nenhum produto disponível no momento.<br>Volte em breve!</p>
    </div>
  </div>

  <!-- Footer social -->
  <div class="bg-dark py-4" id="socialsection">
    <div class="container">
      <a href="#" class="fa fa-facebook mx-2"></a>
      <a href="#" class="fa fa-instagram mx-2"></a>
      <a href="#" class="fa fa-youtube mx-2"></a>
      <a href="#" class="fa fa-spotify mx-2"></a>
      <p class="text-muted mt-3 mb-0">VOLURYA © 2026 - Fortaleza, Brasil</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/store.js"></script>
</body>
</html>


<!--

Links sociais com href="#"
html<a href="#" class="fa fa-facebook mx-2"></a>
Mesmo problema recorrente em todos os templates. Adicione aria-label e URLs reais.

🟡 Ícones sociais sem aria-label e sem texto
html<a href="#" class="fa fa-facebook mx-2"></a>
Elementos <a> sem texto visível nem aria-label são invisíveis para leitores de tela — inacessíveis:
html<a href="#" class="fa fa-facebook mx-2" aria-label="Facebook da Volurya"></a>

🟡 Footer simplificado vs footer completo nos outros templates
about.html e cart.html têm footer completo com logo, links rápidos e copyright estilizado. Este tem apenas ícones e copyright simples — inconsistência visual entre páginas.

🟡 Link #musicsection aponta para seção que não existe nesta página
html<a href="#musicsection">MUSIC</a>
musicsection só existe em index.html. Na store.html esse link não leva a lugar nenhum útil — deveria apontar para /#musicsection.

🟢 Navbar duplicada
Sétima cópia da mesma navbar — já apontado em todos os outros templates. Go templates partials resolveriam isso.

🟢 text-center no <body>
html<body class="bg-dark text-center text-light">
text-center no body afeta todo o conteúdo por padrão — pode causar alinhamento inesperado em elementos que deveriam ser alinhados à esquerda. Aplique apenas onde necessário.



-->
