<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja VOLURYA - Produtos Oficiais</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-center text-light">

  <!-- Navbar (igual ao index) -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarsExample01">
        <ul class="navbar-nav me-auto mb-2">
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/">HOME</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="#musicsection">MUSIC</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="#socialsection">SOCIAL</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link active" href="/store">STORE</a></li>
          <li class="nav-item"><a class="btn btn-outline-primary btn-sm my-2 nav-link" href="/login">Entrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero / Título da loja -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <div class="text-center">
      <h1 class="display-3 text-danger mb-0" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 15px #ff0000;">
          VOLURYA  STORE
      </h1>
      <p class="lead text-light mt-2">Mercadoria oficial da banda mais pesada do Nordeste</p>
    </div>
  </section>

  <!-- Produtos -->
  <div class="container py-5">
    <div id="store-items" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
      <!-- Cards serão inseridos aqui via JS -->
    </div>

    <!-- Mensagem de carregamento / vazio -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Carregando produtos...</span>
      </div>
      <p class="mt-3 text-muted">Carregando produtos oficiais...</p>
    </div>
  </div>

  <!-- Footer social (igual ao index) -->
  <div class="bg-dark py-4" id="socialsection">
    <div class="container">
      <a href="#" class="fa fa-facebook mx-2"></a>
      <a href="#" class="fa fa-instagram mx-2"></a>
      <a href="#" class="fa fa-youtube mx-2"></a>
      <a href="#" class="fa fa-spotify mx-2"></a>
      <p class="text-muted mt-3 mb-0">VOLURYA © 2026 - Fortaleza, Brasil</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/store.js"></script>
</body>
</html>
