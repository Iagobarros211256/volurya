<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volurya Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script type="module" src="/static/js/main.js" defer></script>
</head>
<body class="bg-dark text-white">

<div class="container py-4">
    <h1>Products</h1>

    <button class="btn btn-success mb-3" id="addProductBtn">Add Product</button>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Name</th><th>Price</th><th>Stock</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>

    <button class="btn btn-primary" id="loadMoreBtn">Load More</button>
</div>

<!-- Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5 class="modal-title">Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="productId">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" id="productName">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input class="form-control" id="productDescription">
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" id="productPrice">
        </div>
        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" id="productStock">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/store-admin.js"></script>
</body>
</html>



<!--


Sem verificação de role admin
html<script src="/static/js/store-admin.js"></script>
O store-admin.js verifica apenas isLoggedIn() — qualquer usuário autenticado acessa o painel. A página deveria verificar role admin no frontend também:
javascriptif (!isLoggedIn() || !isAdmin()) {
    window.location.href = '/store'
}

🔴 /static/js/main.js não existe
html<script type="module" src="/static/js/main.js" defer></script>
Na árvore do projeto não há main.js em static/js — os arquivos são auth.js, cart.js, store.js e store-admin.js. Esse import vai falhar silenciosamente com 404.

🔴 Sem proteção de rota no servidor
A rota /adminpanel provavelmente não tem RequireAdminRole no main.go — qualquer um pode acessar a URL diretamente. O HTML deveria ser servido apenas para admins autenticados, ou a rota deveria exigir autenticação server-side.

🟡 Modal sem aria-labelledby
html<div class="modal fade" id="productModal" tabindex="-1">
Sem aria-labelledby apontando para o título — inacessível para leitores de tela:
html<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel">
<h5 class="modal-title" id="productModalLabel">Product</h5>

🟡 Inputs sem required e sem validação no HTML
html<input class="form-control" id="productName">
<input type="number" class="form-control" id="productPrice">
Sem required, min, max — a validação só existe no JavaScript. Uma primeira linha de defesa no HTML ajuda:
html<input class="form-control" id="productName" required minlength="1" maxlength="255">
<input type="number" class="form-control" id="productPrice" required min="0.01" step="0.01">
<input type="number" class="form-control" id="productStock" required min="0">

🟡 lang="en" mas conteúdo misto
html<html lang="en">
O resto do site é lang="pt-br". Esse painel está em inglês mas deveria ser consistente — escolha um idioma e defina o lang corretamente.

🟡 Sem feedback de loading ou erro nas ações
O painel lista produtos mas não há indicador de loading, estado de erro ao falhar requisição, ou confirmação antes de deletar. Um confirm() básico evita deleções acidentais:
javascriptif (!confirm(`Deletar "${product.name}"?`)) return

🟢 Load More sem implementação visível
html<button class="btn btn-primary" id="loadMoreBtn">Load More</button>
O botão existe mas não há event listener em store-admin.js — não funciona. A paginação cursor-based do backend não está conectada.

🟢 Título genérico
html<title>Volurya Admin Panel</title>
Sem indicação da seção atual — se o admin tiver múltiplas abas, não distingue. Considere <title>Produtos — Volurya Admin</title>.


-->
