<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volurya Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script type="module" src="/static/js/main.js" defer></script>
</head>
<body class="bg-dark text-white">

<div class="container py-4">
    <h1>Products</h1>

    <button class="btn btn-success mb-3" id="addProductBtn">Add Product</button>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Name</th><th>Price</th><th>Stock</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>

    <button class="btn btn-primary" id="loadMoreBtn">Load More</button>
</div>

<!-- Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5 class="modal-title">Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="productId">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" id="productName">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input class="form-control" id="productDescription">
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" id="productPrice">
        </div>
        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" id="productStock">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/store-admin.js"></script>
</body>
</html>
