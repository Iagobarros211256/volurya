<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — VOLURYA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand text-danger fw-bold" href="/" style="font-family: 'Russo One', sans-serif;">
        VOLURYA
      </a>
      <div>
        <a href="/store" class="btn btn-outline-danger btn-sm me-2">Ver Loja</a>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>

  <!-- Seção de login (exibida se não for admin) -->
  <div id="loginSection" class="container py-5 d-none">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <h2 class="text-danger mb-4 text-center" style="font-family: 'Russo One', sans-serif;">
          ADMIN LOGIN
        </h2>
        <form id="loginForm">
          <div class="mb-3">
            <input type="email" id="email"
              class="form-control bg-dark text-white border-danger"
              placeholder="Email"
              autocomplete="email"
              required>
          </div>
          <div class="mb-3 password-field">
            <input type="password" id="password"
              class="form-control bg-dark text-white border-danger password-input"
              placeholder="Senha"
              autocomplete="current-password"
              required>
            <button type="button" class="password-toggle"
              data-password-toggle="password"
              aria-label="Mostrar senha">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <button type="submit" class="btn btn-danger w-100">ENTRAR</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Painel admin (exibido apenas para admins) -->
  <div id="adminSection" class="container py-4 d-none">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-danger mb-0" style="font-family: 'Russo One', sans-serif;">
        PAINEL ADMIN
      </h1>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal"
        onclick="resetModal()">
        <i class="fa fa-plus me-1"></i> Novo Produto
      </button>
    </div>

    <!-- Tabela de produtos -->
    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Imagem</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="productsList"></tbody>
      </table>
    </div>

    <div id="products-list" class="mb-4"></div>

  </div>

  <!-- Modal de produto -->
  <div class="modal fade" id="productModal" tabindex="-1"
    aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="productModalLabel">Produto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="productId">
          <div class="mb-3">
            <label class="form-label">Nome <span class="text-danger">*</span></label>
            <input class="form-control bg-dark text-white border-secondary"
              id="productName" required maxlength="255">
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input class="form-control bg-dark text-white border-secondary"
              id="productDesc" maxlength="500">
          </div>
          <div class="mb-3">
            <label class="form-label">Preço (R$) <span class="text-danger">*</span></label>
            <input type="number" class="form-control bg-dark text-white border-secondary"
              id="productPrice" required min="0.01" step="0.01">
          </div>
          <div class="mb-3">
            <label class="form-label">Estoque <span class="text-danger">*</span></label>
            <input type="number" class="form-control bg-dark text-white border-secondary"
              id="productStock" required min="0">
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="saveProductBtn" onclick="saveProduct()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/store-admin.js"></script>
  <script>
    // Reseta o modal para modo criação
    function resetModal() {
      document.getElementById('productId').value = '';
      document.getElementById('productModalLabel').textContent = 'Novo Produto';
      document.getElementById('saveProductBtn').textContent = 'Salvar';
      document.getElementById('productName').value = '';
      document.getElementById('productDesc').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productStock').value = '';
      // Remove handler de update se existir
      document.getElementById('saveProductBtn').onclick = saveProduct;
    }

    // Salvar produto (criar)
    async function saveProduct() {
      const name = document.getElementById('productName').value.trim();
      const desc = document.getElementById('productDesc').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);
      const stock = parseInt(document.getElementById('productStock').value);

      if (!name || isNaN(price) || price <= 0 || isNaN(stock) || stock < 0) {
        showToast('Preencha corretamente todos os campos', 'danger');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/products`, {
          method: 'POST',
          body: JSON.stringify({ name, description: desc, price, stock })
        });

        if (!res.ok) {
          const data = await res.json();
          showToast(data.error || 'Erro ao criar produto', 'danger');
          return;
        }

        showToast('Produto criado!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
        loadProducts();
      } catch {
        showToast('Erro de conexão', 'danger');
      }
    }
  </script>
</body>
</html>
