<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volurya Store Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">

  <h1 class="mb-4">Admin Panel - Store</h1>

  <!-- LOGIN -->
  <div id="login-section">
    <h3>Login</h3>
    <form id="loginForm" class="mb-4">
      <input type="email" id="email" placeholder="Email" class="form-control mb-2" required>
      <input type="password" id="password" placeholder="Password" class="form-control mb-2" required>
      <button class="btn btn-danger">Login</button>
    </form>
  </div>

  <!-- PAINEL ADMIN -->
  <div id="admin-section" style="display:none;">
    <h3>Add Product</h3>
    <form id="productForm" class="mb-4">
      <input type="text" id="productName" placeholder="Name" class="form-control mb-2" required>
      <input type="text" id="productDesc" placeholder="Description" class="form-control mb-2" required>
      <input type="number" id="productPrice" placeholder="Price" class="form-control mb-2" required>
      <input type="number" id="productStock" placeholder="Stock" class="form-control mb-2" required>
      <button class="btn btn-danger">Add Product</button>
    </form>

    <h3>Existing Products</h3>
    <div id="products-list" class="mb-5"></div>
  </div>

</div>

<script src="auth.js"></script>
<script src="store-admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

Página mais problemática dos templates. Análise:

🔴 Caminhos de script incorretos
html<script src="auth.js"></script>
<script src="store-admin.js"></script>
Sem /static/js/ — os scripts não carregam. Todos os outros templates usam /static/js/auth.js. Essa página está quebrada.

🔴 Bootstrap JS carregado depois dos scripts que dependem dele
html<script src="auth.js"></script>
<script src="store-admin.js"></script>
<script src="https://cdn.jsdelivr.net/.../bootstrap.bundle.min.js"></script>
store-admin.js provavelmente usa bootstrap.Toast ou bootstrap.Modal — que não existem ainda quando o script roda. Ordem correta:
html<script src="https://cdn.jsdelivr.net/.../bootstrap.bundle.min.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/store-admin.js"></script>

🔴 Dois templates de admin para a mesma funcionalidade
storeadmin.html e adminpanel.html são dois templates de painel admin diferentes. Um tem modal, outro tem form inline. Um usa products-list, outro usa productTable. O store-admin.js referencia productsList — qual dos dois é o real? Consolide em um único template.

🔴 Sem verificação de autenticação/role
Mesmo problema do adminpanel.html — nenhuma verificação server-side de que o usuário é admin. A rota /storeadmin no main.go provavelmente serve esse HTML para qualquer um.
