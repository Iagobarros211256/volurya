<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - VOLURYA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExample01">
        <ul class="navbar-nav me-auto mb-2">
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/">HOME</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/#musicsection">MUSIC</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/#socialsection">SOCIAL</a></li>
          <li class="nav-item"><a class="btn btn-outline-danger btn-sm my-2 nav-link" href="/store">STORE</a></li>
          <li class="nav-item"><a class="btn btn-outline-primary btn-sm my-2 nav-link" href="/login">Entrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo" style="max-width: 300px;">
  </section>

  <!-- Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <h2 class="text-danger mb-4 text-center" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 10px #ff0000;">
          CRIAR CONTA
        </h2>

        <form id="signupForm">
          <div class="mb-3">
            <input type="email" id="email" class="form-control bg-dark text-white border-danger" placeholder="Email" required autofocus>
          </div>
          <div class="mb-3">
            <input type="password" id="password" class="form-control bg-dark text-white border-danger" placeholder="Senha (mínimo 8 caracteres)" required minlength="8">
          </div>
          <div class="mb-3">
            <input type="password" id="confirmPassword" class="form-control bg-dark text-white border-danger" placeholder="Confirmar senha" required minlength="8">
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">CADASTRAR</button>
        </form>

        <p class="mt-4 text-center text-light">
          Já tem conta? <a href="/login" class="text-danger fw-bold">ENTRAR</a>
        </p>

      </div>
    </div>
  </div>

 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!email || !password || !confirmPassword) {
        showToast('Preencha todos os campos', 'danger');
        return;
      }

      if (password !== confirmPassword) {
        showToast('As senhas não coincidem', 'danger');
        return;
      }

      if (password.length < 8) {
        showToast('A senha deve ter pelo menos 8 caracteres', 'danger');
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('refresh_token', data.refresh_token);
          showToast('Conta criada! Redirecionando...', 'success');
          setTimeout(() => window.location.href = '/store', 1500);
        } else {
          showToast(data.error || 'Erro ao criar conta', 'danger');
        }
      } catch (err) {
        showToast('Erro de conexão. Tente novamente.', 'danger');
      }
    });
  </script>
</body>
</html>
