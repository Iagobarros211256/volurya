{% extends "base.html" %}

{% block title %}Login - VOLURYA{% endblock %}

{% block content %}
  <!-- Hero / Logo -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo" style="max-width: 300px;">
  </section>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <h2 class="text-danger mb-4 text-center">ENTRAR NA ÁREA VIP</h2>

        <form id="loginForm">
          <div class="mb-3">
            <input type="email" id="email" class="form-control bg-dark text-white border-danger" placeholder="Email" required autofocus>
          </div>
          <div class="mb-3">
            <input type="password" id="password" class="form-control bg-dark text-white border-danger" placeholder="Senha" required minlength="8">
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">LOGIN</button>
        </form>

        <p class="mt-4 text-center text-light">
          Ainda não tem conta? <a href="/signup" class="text-danger fw-bold">CADASTRE-SE</a>
        </p>

        <!-- Toast -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
          <div id="authToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
              <div class="toast-body" id="toastMessage"></div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toastEl = document.getElementById('authToast');
    const toastMsg = document.getElementById('toastMessage');
    const bsToast = new bootstrap.Toast(toastEl);

    function showToast(message, type = 'danger') {
      toastEl.classList.remove('text-bg-success', 'text-bg-danger');
      toastEl.classList.add(`text-bg-${type}`);
      toastMsg.textContent = message;
      bsToast.show();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showToast('Preencha email e senha', 'danger');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          showToast('Login realizado! Redirecionando...', 'success');
          setTimeout(() => window.location.href = '/store', 1500);
        } else {
          showToast(data.error || 'Email ou senha inválidos', 'danger');
        }
      } catch (err) {
        showToast('Erro de conexão. Tente novamente.', 'danger');
      }
    });
  </script>
{% endblock %}
