<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - VOLURYA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Russo+One&display=swap">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-light">

  <!-- Hero -->
  <section class="hero d-flex justify-content-center align-items-center bg-dark py-5">
    <img src="/static/imagens/VOLURYALOGOVAZADA.png" class="hero-logo" style="max-width: 300px;">
  </section>

  <!-- Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <h2 class="text-danger mb-4 text-center" style="font-family: 'Russo One', sans-serif; text-shadow: 0 0 10px #ff0000;">
          CRIAR CONTA
        </h2>

        <form id="signupForm">
          <div class="mb-3">
            <input type="email" id="email"
              class="form-control bg-dark text-white border-danger"
              placeholder="Email"
              autocomplete="email"
              required
              autofocus>
          </div>
          <div class="mb-3 password-field">
            <input type="password" id="password"
              class="form-control bg-dark text-white border-danger password-input"
              placeholder="Senha (mínimo 8 caracteres)"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="128">
            <button type="button" class="password-toggle"
              data-password-toggle="password"
              aria-label="Mostrar senha">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <div class="mb-3 password-field">
            <input type="password" id="confirmPassword"
              class="form-control bg-dark text-white border-danger password-input"
              placeholder="Confirmar senha"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="128">
            <button type="button" class="password-toggle"
              data-password-toggle="confirmPassword"
              aria-label="Mostrar senha">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">CADASTRAR</button>
        </form>

        <p class="mt-4 text-center text-light">
          Já tem conta? <a href="/login" class="text-danger fw-bold">ENTRAR</a>
        </p>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    // Redireciona se já estiver logado
    isLoggedIn().then(loggedIn => {
      if (loggedIn) window.location.href = getAuthRedirect('/store');
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;         // sem trim
      const confirmPassword = document.getElementById('confirmPassword').value; // sem trim

      if (!email || !password || !confirmPassword) {
        showToast('Preencha todos os campos', 'danger');
        return;
      }

      if (password !== confirmPassword) {
        showToast('As senhas não coincidem', 'danger');
        return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const res = await originalFetch(`${API_BASE}/signup`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          invalidateAuthCache();
          showToast('Conta criada! Redirecionando...', 'success');
          setTimeout(() => window.location.href = getAuthRedirect('/store'), 1500);
        } else {
          showToast(data.error || 'Erro ao criar conta', 'danger');
          btn.disabled = false;
          btn.textContent = 'CADASTRAR';
        }
      } catch {
        showToast('Erro de conexão. Tente novamente.', 'danger');
        btn.disabled = false;
        btn.textContent = 'CADASTRAR';
      }
    });
  </script>
</body>
</html>
